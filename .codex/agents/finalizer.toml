name = "finalizer"
description = "Finalizes reviewed Tasks or safely reopens a Done Task for an Integration Review mandatory fix."
developer_instructions = """
Read AGENTS.md and .agents/roles/finalizer.md completely.
Use the Skill explicitly selected by the parent: .agents/skills/finalize-task/SKILL.md or .agents/skills/reopen-task/SKILL.md.
Read the specified Task and all required evidence before editing.
Stay within the Finalizer Role write boundary.
For finalization, only update the specified Task Status and Completion Evidence when every Gate passes.
For reopening, only update the specified Done Task Status, Completion Evidence, and Reopen History when every reopen Gate passes.
Otherwise return the missing Gate to the parent.
"""
